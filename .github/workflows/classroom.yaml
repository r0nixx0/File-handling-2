name: Autograding Tests

on:
  push:
    paths:
      - 'assignment.py'
      - 'test_assignment.py'
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Ex 1 - Save scores
        id: ex1_save_scores
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Save scores
          command: pytest test_assignment.py::test1_save_scores
          timeout: 2
          max-score: 1

      - name: Ex 1 - Replaces old file
        id: ex1_overwrites
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Replaces old file
          command: pytest test_assignment.py::test1_overwrites
          timeout: 2
          max-score: 1

      - name: Ex 2 - Average score
        id: ex2_average_score
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Average score
          command: pytest test_assignment.py::test2_average_score
          timeout: 2
          max-score: 1

      - name: Ex 2 - Empty file
        id: ex2_empty_file
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Empty file
          command: pytest test_assignment.py::test2_empty_file
          timeout: 2
          max-score: 1

      - name: Ex 3 - Filter passed
        id: ex3_filter_passed
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Filter passed
          command: pytest test_assignment.py::test3_filter_passed
          timeout: 2
          max-score: 1

      - name: Ex 3 - Source unchanged
        id: ex3_source_unchanged
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Source unchanged
          command: pytest test_assignment.py::test3_source_unchanged
          timeout: 2
          max-score: 1

      - name: Ex 4 - Replace word
        id: ex4_replace_word
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Replace word
          command: pytest test_assignment.py::test4_replace_word
          timeout: 2
          max-score: 1

      - name: Ex 4 - No match keeps file
        id: ex4_no_match_keeps_file
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - No match keeps file
          command: pytest test_assignment.py::test4_no_match_keeps_file
          timeout: 2
          max-score: 1

      - name: Ex 5 - Remove line
        id: ex5_remove_line
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 5 - Remove line
          command: pytest test_assignment.py::test5_remove_line
          timeout: 2
          max-score: 1

      - name: Ex 5 - Invalid line number
        id: ex5_invalid_line_number
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 5 - Invalid line number
          command: pytest test_assignment.py::test5_invalid_line_number
          timeout: 2
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX1_SAVE_SCORES_RESULTS: "${{ steps.ex1_save_scores.outputs.result }}"
          EX1_OVERWRITES_RESULTS: "${{ steps.ex1_overwrites.outputs.result }}"
          EX2_AVERAGE_SCORE_RESULTS: "${{ steps.ex2_average_score.outputs.result }}"
          EX2_EMPTY_FILE_RESULTS: "${{ steps.ex2_empty_file.outputs.result }}"
          EX3_FILTER_PASSED_RESULTS: "${{ steps.ex3_filter_passed.outputs.result }}"
          EX3_SOURCE_UNCHANGED_RESULTS: "${{ steps.ex3_source_unchanged.outputs.result }}"
          EX4_REPLACE_WORD_RESULTS: "${{ steps.ex4_replace_word.outputs.result }}"
          EX4_NO_MATCH_KEEPS_FILE_RESULTS: "${{ steps.ex4_no_match_keeps_file.outputs.result }}"
          EX5_REMOVE_LINE_RESULTS: "${{ steps.ex5_remove_line.outputs.result }}"
          EX5_INVALID_LINE_NUMBER_RESULTS: "${{ steps.ex5_invalid_line_number.outputs.result }}"
        with:
          runners: ex1_save_scores,ex1_overwrites,ex2_average_score,ex2_empty_file,ex3_filter_passed,ex3_source_unchanged,ex4_replace_word,ex4_no_match_keeps_file,ex5_remove_line,ex5_invalid_line_number
